# File: .github/workflows/daily-data-sync.yml

name: Daily Stock EOD Sync & Keep-Alive

on:
  schedule:
    # Berjalan otomatis setiap Senin - Jumat pukul 10:30 UTC (17:30 WIB)
    - cron: '30 10 * * 1-5'
  # Tombol trigger manual di tab Actions GitHub
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v22 untuk kompatibilitas Supabase terbaru)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Run EOD Sync Worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx src/scripts/sync-yahoo-finance.ts
